services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5277:5277"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 5277
      Authentication__Authority: http://localhost:5277
      Authentication__ClientCredentialsSecret: ${BOOKSTORE_CLIENT_SECRET:-BookstoreClientSecret123!}
      ConnectionStrings__Bookstore: Server=database,1433;Database=BookstoreDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Bookstore123!};TrustServerCertificate=True
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Bookstore123!}
    ports:
      - "1433:1433"
    volumes:
      - bookstore-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  bookstore-data:
